# ============================================================================
#  `pgvector` profile — dense / hybrid retrieval on Postgres + pgvector.
#
#  Activate with:  --spring.profiles.active=pgvector   (or SPRING_PROFILES_ACTIVE)
#  Requires:  Postgres with the `vector` extension, and the local embedding
#             service (embedding-service/run.sh) on :8000.
#
#  The DEFAULT profile is unchanged — H2 in-memory + offline TF-IDF — so the app
#  still runs with no external services. This file only overrides what differs.
# ============================================================================

# ---- Postgres datasource (replaces the default H2) ----
spring.datasource.url=jdbc:postgresql://localhost:5432/smartestate
spring.datasource.username=admin
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# `create` recreates the estate schema fresh on every startup, so the demo always
# reseeds cleanly — the same behaviour as the default H2 profile. (With `update`,
# Postgres kept stale seed data forever and the seeder skipped, so changes to the
# seed never took effect.) For a deployment that must PERSIST data, switch this to
# `update` or `validate` and manage schema with migrations. The pgvector chunk table
# is not JPA-mapped — PgVectorStore creates it idempotently and reloads it each run.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Hong_Kong

# H2 console is meaningless on Postgres.
spring.h2.console.enabled=false

# ---- Retrieval strategy ----
# lexical (baseline, TF-IDF) | dense (embeddings only) | hybrid (RRF fusion of both)
app.ai.retrieval.mode=hybrid
# how many dense candidates to pull before fusion / packaging
app.ai.retrieval.dense-candidates=20
# Reciprocal Rank Fusion constant (Cormack et al., 2009)
app.ai.retrieval.rrf-k=60

# ---- Local embedding service (embedding-service/) ----
app.ai.embedding.base-url=http://127.0.0.1:8000
app.ai.embedding.dim=384
app.ai.embedding.timeout-ms=20000
