<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/island :: head('Audit log')}"></head>
<body>
<div id="root"></div>
<th:block th:replace="~{fragments/island :: appctx}"></th:block>
<script th:inline="javascript">
    window.__PAGE__ = {
        name: 'admin-audit',
        title: 'Audit Log',
        data: {
            emergencyOnly: [[${emergencyOnly}]],
            logs: [
                /*[# th:each="l : ${logs}"]*/
                {
                    timestamp: [[${#temporals.format(l.timestamp, 'yyyy-MM-dd HH:mm:ss')}]],
                    actor: [[${l.actor}]],
                    action: [[${l.action}]],
                    detail: [[${l.detail}]],
                    emergencyRelated: [[${l.emergencyRelated}]]
                },
                /*[/]*/
            ]
        }
    };
</script>
<script th:replace="~{fragments/island :: bundle}"></script>
</body>
</html>
