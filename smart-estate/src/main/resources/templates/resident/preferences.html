<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/island :: head('Preferences')}"></head>
<body>
<div id="root"></div>
<th:block th:replace="~{fragments/island :: appctx}"></th:block>
<script th:inline="javascript">
    window.__PAGE__ = {
        name: 'resident-preferences',
        title: 'Communication Preferences',
        data: {
            enabledChannels: [ /*[# th:each="c : ${enabledChannels}"]*/ [[${c}]], /*[/]*/ ],
            defaultChannel: [[${defaultChannel}]],
            prefs: [
                /*[# th:each="p : ${prefs}"]*/
                {
                    id: [[${p.id}]],
                    category: [[${p.category.name()}]],
                    channel: [[${p.channel.name()}]],
                    language: [[${p.language.name()}]]
                },
                /*[/]*/
            ]
        }
    };
</script>
<script th:replace="~{fragments/island :: bundle}"></script>
</body>
</html>
