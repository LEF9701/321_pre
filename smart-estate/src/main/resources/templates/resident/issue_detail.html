<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/island :: head('Issue ' + ${issue.refNumber})}"></head>
<body>
<div id="root"></div>
<th:block th:replace="~{fragments/island :: appctx}"></th:block>
<script th:inline="javascript">
    window.__PAGE__ = {
        name: 'resident-issue-detail',
        title: [[${'Issue ' + issue.refNumber}]],
        data: {
            issueId: [[${issue.id}]],
            issue: {
                id: [[${issue.id}]],
                refNumber: [[${issue.refNumber}]],
                category: [[${issue.category.name()}]],
                status: [[${issue.status.name()}]],
                priority: [[${issue.priority.name()}]],
                assignedTo: [[${issue.assignedTo}]],
                createdAt: [[${#temporals.format(issue.createdAt, 'yyyy-MM-dd HH:mm')}]],
                updatedAt: [[${#temporals.format(issue.updatedAt, 'yyyy-MM-dd HH:mm')}]],
                description: [[${issue.description}]],
                resolutionNote: [[${issue.resolutionNote}]],
                photoFilename: [[${issue.photoFilename}]]
            },
            comments: [
                /*[# th:each="c : ${comments}"]*/
                {
                    authorName: [[${c.authorName}]],
                    authorRole: [[${c.authorRole.name()}]],
                    body: [[${c.body}]],
                    createdAt: [[${#temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm')}]]
                },
                /*[/]*/
            ]
        }
    };
</script>
<script th:replace="~{fragments/island :: bundle}"></script>
</body>
</html>
