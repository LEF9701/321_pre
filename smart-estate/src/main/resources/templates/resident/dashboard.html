<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/island :: head('Dashboard')}"></head>
<body>
<div id="root"></div>
<th:block th:replace="~{fragments/island :: appctx}"></th:block>
<script th:inline="javascript">
    window.__PAGE__ = {
        name: 'resident-dashboard',
        title: 'Dashboard',
        data: {
            unitFullCode: [[${unit != null ? unit.fullCode : null}]],
            unitFeeStatus: [[${unit != null ? unit.feeStatus.name() : null}]],
            unreadCount: [[${unreadCount}]],
            openIssueCount: [[${openIssueCount}]],
            inbox: [
                /*[# th:each="item : ${inbox}"]*/
                {
                    id: [[${item.notification.id}]],
                    title: [[${item.notification.title}]],
                    titleZh: [[${item.notification.titleZh}]],
                    category: [[${item.notification.category.name()}]],
                    dispatchedAt: [[${#temporals.format(item.notification.dispatchedAt, 'MM-dd HH:mm')}]],
                    read: [[${item.read}]],
                    status: [[${item.bestStatus.name()}]]
                },
                /*[/]*/
            ],
            issues: [
                /*[# th:each="i : ${issues}"]*/
                {
                    id: [[${i.id}]],
                    refNumber: [[${i.refNumber}]],
                    category: [[${i.category.name()}]],
                    status: [[${i.status.name()}]],
                    priority: [[${i.priority.name()}]]
                },
                /*[/]*/
            ],
            schedules: [
                /*[# th:each="s : ${schedules}"]*/
                {
                    date: [[${#temporals.format(s.scheduledDate, 'yyyy-MM-dd')}]],
                    title: [[${s.title}]],
                    affectedScope: [[${s.affectedScope}]]
                },
                /*[/]*/
            ]
        }
    };
</script>
<script th:replace="~{fragments/island :: bundle}"></script>
</body>
</html>
