<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/island :: head('Report Issue')}"></head>
<body>
<div id="root"></div>
<th:block th:replace="~{fragments/island :: appctx}"></th:block>
<script th:inline="javascript">
    window.__PAGE__ = {
        name: 'resident-issue-new',
        title: 'Report an Issue',
        data: {
            description: [[${description}]],
            suggestion: /*[# th:if="${suggestion != null and suggestion.hasPrediction}"]*/ {
                predictedCategory: [[${suggestion.predicted.name()}]],
                confidencePct: [[${suggestion.confidencePct}]],
                neighbors: [
                    /*[# th:each="nb : ${suggestion.neighbors}"]*/
                    {
                        refNumber: [[${nb.refNumber}]],
                        category: [[${nb.category.name()}]],
                        score: [[${nb.score}]]
                    },
                    /*[/]*/
                ]
            } /*[/]*/ /*[# th:unless="${suggestion != null and suggestion.hasPrediction}"]*/ null /*[/]*/
        }
    };
</script>
<script th:replace="~{fragments/island :: bundle}"></script>
</body>
</html>
