name: SmartEstatePush
options:
  bundleIdPrefix: hk.smartestate
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.35.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    TARGETED_DEVICE_FAMILY: "1"          # iPhone
    DEVELOPMENT_TEAM: ""                 # set your 10-char Team ID before device builds

targets:
  SmartEstatePush:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Info.plist"
          - "SmartEstatePush.entitlements"
    settings:
      base:
        PRODUCT_NAME: SmartEstatePush
        PRODUCT_BUNDLE_IDENTIFIER: hk.smartestate.app
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/SmartEstatePush.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
